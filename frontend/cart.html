<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Cart - Smart Canteen</title>

    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-100">

    <!-- Navbar -->
    <nav class="bg-white shadow-md">
        <div class="max-w-6xl mx-auto px-6 py-4 flex justify-between items-center">

            <a href="index.html" class="text-2xl font-bold">
                Smart Canteen
            </a>

            <div class="flex gap-5">
                <a href="index.html" class="text-gray-700">
                    Home
                </a>

                <a href="menu.html" class="text-gray-700">
                    Menu
                </a>

                <a href="cart.html" class="text-blue-600 font-semibold">
                    Cart
                </a>

                <span id="authLink"></span>
                
            </div>

        </div>
    </nav>


    <!-- Cart Section -->
    <section class="max-w-4xl mx-auto px-6 py-10">

        <h1 class="text-3xl font-bold mb-8">
            Your Cart
        </h1>

        <!-- Cart Items -->
        <div id="cartItems"></div>


        <!-- Summary -->
        <div class="bg-white p-6 rounded-lg shadow-md mt-6">

            <div class="flex justify-between text-xl font-bold">

                <span>
                    Total Amount
                </span>

                <span id="cartTotal">
                    ₹0
                </span>

            </div>


            <button
                onclick="proceedToOrder()"
                class="w-full bg-blue-600 text-white py-3 rounded-lg mt-6 font-semibold hover:bg-blue-700">

                Proceed to Order

            </button>

        </div>

    </section>


    <!-- JavaScript -->
    <script src="cart.js"></script>

</body>

</html>
