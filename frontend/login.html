<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Student Login - Smart Canteen</title>

    <script src="https://cdn.tailwindcss.com"></script>

</head>


<body class="bg-gray-100">


    <!-- Navbar -->

    <nav class="bg-white shadow-md">

        <div class="max-w-6xl mx-auto px-6 py-4">

            <a href="index.html"
               class="text-2xl font-bold">

                Smart Canteen

            </a>

        </div>

    </nav>



    <!-- Login -->

    <main class="max-w-md mx-auto px-6 py-10">

        <div class="bg-white p-8 rounded-lg shadow-md">


            <h1 class="text-3xl font-bold text-center mb-8">

                Student Login

            </h1>


            <form id="loginForm">


                <!-- Email -->

                <label class="block font-semibold mb-2">
                    Email
                </label>

                <input
                    type="email"
                    id="email"
                    placeholder="Enter your email"
                    required
                    class="w-full border p-3 rounded-lg mb-5"
                >


                <!-- Password -->

                <label class="block font-semibold mb-2">
                    Password
                </label>

                <input
                    type="password"
                    id="password"
                    placeholder="Enter your password"
                    required
                    class="w-full border p-3 rounded-lg mb-6"
                >


                <!-- Login -->

                <button
                    type="submit"
                    class="w-full bg-blue-600 text-white py-3 rounded-lg font-semibold hover:bg-blue-700">

                    Login

                </button>


            </form>


            <!-- Register -->

            <p class="text-center mt-6">

                Don't have an account?

                <a href="register.html"
                   class="text-blue-600 font-semibold">

                    Register

                </a>

            </p>


        </div>

    </main>



    <script>

const loginForm =
    document.getElementById("loginForm");


loginForm.addEventListener("submit", async function(event) {

    event.preventDefault();


    const email =
        document.getElementById("email").value;

    const password =
        document.getElementById("password").value;


    try {

        const response = await fetch(
            "https://smart-canteen-1-qysl.onrender.com/api/auth/login",
            {

                method: "POST",

                headers: {
                    "Content-Type": "application/json"
                },

                body: JSON.stringify({

                    email: email,
                    password: password

                })

            }
        );


        const data = await response.json();


        if (response.ok) {

            alert(data.message);


            // Save logged-in student
            localStorage.setItem(
                "student",
                JSON.stringify(data.user)
            );


localStorage.setItem("user_id", data.user.id);

            window.location.href = "menu.html";

        } else {

            alert(data.message);

        }


    } catch (error) {

        console.log(error);

        alert(
            "Cannot connect to server."
        );

    }

});

</script>


</body>

</html>
