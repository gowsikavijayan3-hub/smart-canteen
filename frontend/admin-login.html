<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Admin Login - Smart Canteen</title>

    <script src="https://cdn.tailwindcss.com"></script>

</head>


<body class="bg-gray-100 min-h-screen flex items-center justify-center">


    <div class="bg-white w-full max-w-md p-8 rounded-xl shadow-lg">


        <h1 class="text-3xl font-bold text-center mb-2">
            Smart Canteen
        </h1>


        <h2 class="text-xl font-semibold text-center mb-8">
            Admin Login
        </h2>


        <form id="adminLoginForm">


            <!-- Email -->

            <div class="mb-5">

                <label class="block font-semibold mb-2">
                    Admin Email
                </label>

                <input
                    type="email"
                    id="email"
                    placeholder="Enter admin email"
                    class="w-full border p-3 rounded-lg"
                    required
                >

            </div>


            <!-- Password -->

            <div class="mb-5">

                <label class="block font-semibold mb-2">
                    Password
                </label>

                <input
                    type="password"
                    id="password"
                    placeholder="Enter password"
                    class="w-full border p-3 rounded-lg"
                    required
                >

            </div>


            <!-- Login Button -->

            <button
                type="submit"
                class="w-full bg-purple-600 text-white py-3 rounded-lg font-semibold hover:bg-purple-700"
            >
                Login
            </button>


        </form>


        <!-- Message -->

        <p
            id="message"
            class="text-center mt-5 font-semibold"
        ></p>


    </div>



<script>


// ==========================================
// ADMIN LOGIN
// ==========================================

document
.getElementById("adminLoginForm")
.addEventListener(
    "submit",
    async function(event) {

        event.preventDefault();


        const email =
            document
            .getElementById("email")
            .value
            .trim();


        const password =
            document
            .getElementById("password")
            .value;


        const message =
            document
            .getElementById("message");


        message.textContent =
            "Logging in...";

        message.className =
            "text-center mt-5 font-semibold text-gray-600";


        try {


            const response =
                await fetch(
                    "http://localhost:5000/api/auth/admin-login",
                    {

                        method: "POST",

                        headers: {

                            "Content-Type":
                                "application/json"

                        },

                        body: JSON.stringify({

                            email: email,

                            password: password

                        })

                    }
                );


            const data =
                await response.json();


            // ==========================================
            // LOGIN FAILED
            // ==========================================

            if (!response.ok) {

                message.textContent =
                    data.message ||
                    "Invalid admin email or password.";

                message.className =
                    "text-center mt-5 font-semibold text-red-600";

                return;
            }


            // ==========================================
            // SAVE ADMIN JWT TOKEN
            // ==========================================

            localStorage.setItem(
                "adminToken",
                data.token
            );


            // Save admin details

            localStorage.setItem(
                "admin",
                JSON.stringify(data.user)
            );


            // ==========================================
            // SUCCESS
            // ==========================================

            message.textContent =
                "Login successful!";

            message.className =
                "text-center mt-5 font-semibold text-green-600";


            // Go to your EXISTING dashboard

            setTimeout(function() {

                window.location.href =
                    "admin-dashboard.html";

            }, 500);


        } catch (error) {

            console.error(
                "Admin login error:",
                error
            );


            message.textContent =
                "Cannot connect to server.";

            message.className =
                "text-center mt-5 font-semibold text-red-600";

        }

    }
);


</script>


</body>

</html>
