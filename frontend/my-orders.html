<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>My Orders - Smart Canteen</title>

    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-100">

    <!-- Navbar -->
    <nav class="bg-white shadow-md">

        <div class="max-w-6xl mx-auto px-6 py-4 flex justify-between items-center">

            <h1 class="text-2xl font-bold">
                Smart Canteen
            </h1>

            <a href="menu.html"
               class="text-blue-600 font-semibold">
                Menu
            </a>

        </div>

    </nav>


    <!-- Main -->
    <main class="max-w-4xl mx-auto px-6 py-10">

        <h1 class="text-3xl font-bold mb-8">
            My Orders
        </h1>


        <div id="ordersContainer"
             class="space-y-5">

            <p class="text-gray-500">
                Loading orders...
            </p>

        </div>

    </main>


<script>

async function loadMyOrders() {

    const container =
        document.getElementById("ordersContainer");


    // ==========================================
    // CHECK LOGIN
    // ==========================================

    const student =
        JSON.parse(
            localStorage.getItem("student")
        );


    if (!student || !student.id) {

        container.innerHTML = `
            <p class="text-red-600">
                Please login first.
            </p>
        `;

        return;
    }


    // ==========================================
    // GET USER ID
    // ==========================================

    const userId =
        localStorage.getItem("user_id");


    console.log(
        "USER ID FROM LOGIN:",
        userId
    );


    if (!userId) {

        container.innerHTML = `
            <p class="text-red-600">
                User ID not found. Please login again.
            </p>
        `;

        return;
    }


    // ==========================================
    // LOAD ORDERS
    // ==========================================

    try {

        const response = await fetch(
            `http://localhost:5000/api/orders/user/${userId}`
        );


        if (!response.ok) {

            throw new Error(
                "Failed to load orders"
            );

        }


        const orders =
            await response.json();


        // ==========================================
        // NO ORDERS
        // ==========================================

        if (orders.length === 0) {

            container.innerHTML = `
                <p class="text-gray-500">
                    You have no orders.
                </p>
            `;

            return;
        }


        container.innerHTML = "";


        // ==========================================
        // DISPLAY ORDERS
        // ==========================================

        orders.forEach(order => {


            // ======================================
            // QR CODE
            // Show ONLY when READY
            // ======================================

            let qrSection = "";


            if (
                order.qr_token &&
                order.status === "READY"
            ) {

                qrSection = `

                    <div class="mt-5 border-t pt-5">

                        <p class="font-semibold mb-3">
                            QR Code
                        </p>

                        <img
                            src="https://api.qrserver.com/v1/create-qr-code/?size=200x200&data=${encodeURIComponent(order.qr_token)}"
                            alt="Order QR Code"
                            class="border rounded-lg"
                        >

                        <p class="text-gray-500 text-sm mt-3">
                            Show this QR code at the pickup counter.
                        </p>

                    </div>

                `;

            }


            // ======================================
            // COLLECTED MESSAGE
            // ======================================

            let collectedMessage = "";


            if (order.status === "COLLECTED") {

                collectedMessage = `

                    <div class="mt-5 bg-green-50 border border-green-200 rounded-lg p-4">

                        <p class="text-green-700 font-semibold">
                            ✓ Order Collected
                        </p>

                        <p class="text-green-600 text-sm mt-1">
                            This order has already been collected.
                        </p>

                    </div>

                `;

            }


            // ======================================
            // PREPARING MESSAGE
            // ======================================

            let preparingMessage = "";


            if (order.status === "PREPARING") {

                preparingMessage = `

                    <div class="mt-5 bg-yellow-50 border border-yellow-200 rounded-lg p-4">

                        <p class="text-yellow-700 font-semibold">
                            Your order is being prepared.
                        </p>

                        <p class="text-yellow-600 text-sm mt-1">
                            The QR code will be available when your order is ready.
                        </p>

                    </div>

                `;

            }


            // ======================================
            // PLACED MESSAGE
            // ======================================

            let placedMessage = "";


            if (order.status === "PLACED") {

                placedMessage = `

                    <div class="mt-5 bg-blue-50 border border-blue-200 rounded-lg p-4">

                        <p class="text-blue-700 font-semibold">
                            Order Placed
                        </p>

                        <p class="text-blue-600 text-sm mt-1">
                            Your order has been placed successfully.
                        </p>

                    </div>

                `;

            }


            // ======================================
            // CANCELLED MESSAGE
            // ======================================

            let cancelledMessage = "";


            if (order.status === "CANCELLED") {

                cancelledMessage = `

                    <div class="mt-5 bg-red-50 border border-red-200 rounded-lg p-4">

                        <p class="text-red-700 font-semibold">
                            ✕ Order Cancelled
                        </p>

                        <p class="text-red-600 text-sm mt-1">
                            This order has been cancelled.
                        </p>

                    </div>

                `;

            }


            // ======================================
            // CANCEL BUTTON
            //
            // Student can cancel ONLY when
            // Admin has NOT started preparing.
            //
            // PLACED = Cancel allowed
            // PREPARING = Cancel not allowed
            // READY = Cancel not allowed
            // COLLECTED = Cancel not allowed
            // CANCELLED = Cancel not allowed
            // ======================================

            let cancelButton = "";


            if (order.status === "PLACED") {

                cancelButton = `

                    <div class="mt-5">

                        <button
                            onclick="cancelOrder(${order.id})"
                            class="bg-red-600 hover:bg-red-700 text-white font-semibold px-5 py-2 rounded-lg transition">

                            Cancel Order

                        </button>

                    </div>

                `;

            }


            // ==========================================
            // ORDER CARD
            // ==========================================

            container.innerHTML += `

                <div class="bg-white p-6 rounded-lg shadow">


                    <!-- Header -->

                    <div class="flex justify-between items-center">

                        <h2 class="text-xl font-bold">
                            Order #${order.id}
                        </h2>


                        <span class="font-bold">
                            ${order.status}
                        </span>

                    </div>


                    <!-- Total -->

                    <p class="mt-4">
                        <strong>Total:</strong>
                        ₹${order.total_amount}
                    </p>


                    <!-- Pickup Date -->

                    <p>
                        <strong>Pickup Date:</strong>
                        ${order.pickup_date}
                    </p>


                    <!-- Pickup Time -->

                    <p>
                        <strong>Pickup Time:</strong>
                        ${order.pickup_time}
                    </p>


                    <!-- Counter -->

                    <p>
                        <strong>Counter:</strong>
                        ${order.counter}
                    </p>


                    <!-- Placed Message -->

                    ${placedMessage}


                    <!-- Preparing Message -->

                    ${preparingMessage}


                    <!-- QR Section -->

                    ${qrSection}


                    <!-- Collected Message -->

                    ${collectedMessage}


                    <!-- Cancelled Message -->

                    ${cancelledMessage}


                    <!-- Cancel Button -->

                    ${cancelButton}


                </div>

            `;

        });


    } catch (error) {

        console.error(error);


        container.innerHTML = `

            <p class="text-red-600">
                Cannot load orders.
            </p>

        `;

    }

}


// ==========================================
// CANCEL ORDER
// ==========================================

async function cancelOrder(orderId) {

    const confirmCancel = confirm(
        "Are you sure you want to cancel this order?"
    );


    if (!confirmCancel) {

        return;

    }


    try {

        const response = await fetch(
            `http://localhost:5000/api/orders/${orderId}/cancel`,
            {
                method: "PUT",
                headers: {
                    "Content-Type": "application/json"
                }
            }
        );


        const data =
            await response.json();


        // ======================================
        // SUCCESS
        // ======================================

        if (data.success) {

            alert(
                "Order cancelled successfully!"
            );


            // Reload orders
            loadMyOrders();

        }


        // ======================================
        // ERROR
        // ======================================

        else {

            alert(
                data.message ||
                "Unable to cancel order."
            );

        }


    } catch (error) {

        console.error(
            "Cancel order error:",
            error
        );


        alert(
            "Failed to cancel order."
        );

    }

}


// ==========================================
// LOAD ORDERS WHEN PAGE OPENS
// ==========================================

loadMyOrders();

</script>


</body>

</html>
