<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Staff Login - Smart Canteen</title>

    <script src="https://cdn.tailwindcss.com"></script>

</head>


<body class="bg-gray-100">


<nav class="bg-white shadow-md">

    <div class="max-w-6xl mx-auto px-6 py-4">

        <h1 class="text-2xl font-bold">
            Smart Canteen - Staff
        </h1>

    </div>

</nav>



<main class="max-w-md mx-auto px-6 py-12">

    <div class="bg-white p-8 rounded-lg shadow-md">


        <h1 class="text-3xl font-bold text-center mb-2">
            Staff Login
        </h1>


        <p class="text-center text-gray-500 mb-8">
            Enter your staff ID and password
        </p>



        <form id="staffLoginForm">


            <!-- Staff ID -->

            <label class="block font-semibold mb-2">

                Staff ID

            </label>


            <input
                type="text"
                id="staffId"
                placeholder="Enter Staff ID"
                required
                class="w-full border p-3 rounded-lg mb-5"
            >



            <!-- Password -->

            <label class="block font-semibold mb-2">

                Password

            </label>


            <input
                type="password"
                id="staffPassword"
                placeholder="Enter password"
                required
                class="w-full border p-3 rounded-lg mb-6"
            >



            <!-- Login -->

            <button
                type="submit"
                class="w-full bg-green-600 text-white py-3 rounded-lg font-semibold hover:bg-green-700"
            >

                Staff Login

            </button>


        </form>



        <p
            id="message"
            class="text-center mt-5 font-semibold"
        ></p>


        <div class="text-center mt-6">

            <a
                href="login-options.html"
                class="text-blue-600"
            >

                ← Back

            </a>

        </div>


    </div>

</main>



<script>


const form =
    document.getElementById(
        "staffLoginForm"
    );


form.addEventListener(
    "submit",
    async function(event) {

        event.preventDefault();


        const staffId =
            document
                .getElementById("staffId")
                .value
                .trim();


        const password =
            document
                .getElementById("staffPassword")
                .value;


        const message =
            document.getElementById(
                "message"
            );


        message.textContent =
            "Checking login...";

        message.className =
            "text-center mt-5 font-semibold text-blue-600";


        try {

            const response =
                await fetch(
                  "https://smart-canteen-1-qysl.onrender.com/api/auth/staff-login",
                    {

                        method: "POST",

                        headers: {

                            "Content-Type":
                                "application/json"

                        },

                        body: JSON.stringify({

                            staffId:
                                staffId,

                            password:
                                password

                        })

                    }
                );


            const data =
                await response.json();


            if (!response.ok) {

                message.textContent =
                    data.message ||
                    "Login failed";

                message.className =
                    "text-center mt-5 font-semibold text-red-600";

                return;

            }


            // Save staff information

            localStorage.setItem(
                "staff",
                JSON.stringify(data.user)
            );

            localStorage.setItem("staffToken", data.token);

            
            localStorage.setItem(
                "staff_id",
                data.user.staffId
            );


            localStorage.setItem(
                "staff_counter",
                data.user.counter
            );


            alert(
                "Staff login successful!"
            );


            window.location.href =
                "staff-scan.html";


        } catch (error) {

            console.error(error);


            message.textContent =
                "Cannot connect to server.";


            message.className =
                "text-center mt-5 font-semibold text-red-600";

        }

    }
);

</script>


</body>

</html>
