<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>QR Verification - Smart Canteen</title>

    <script src="https://cdn.tailwindcss.com"></script>

    <!-- QR Scanner Library -->
    <script src="https://unpkg.com/html5-qrcode"></script>

</head>

<body class="bg-gray-100">

    <!-- Navbar -->
    <nav class="bg-white shadow-md">

        <div class="max-w-6xl mx-auto px-6 py-4 flex justify-between items-center">

            <a href="index.html" class="text-2xl font-bold">
                Smart Canteen
            </a>

            <div class="flex gap-5">

                <a href="index.html" class="text-gray-700">
                    Home
                </a>

                <a href="menu.html" class="text-gray-700">
                    Menu
                </a>

                <span id="authLink"></span>

            </div>

        </div>

    </nav>


    <!-- Main -->
    <main class="max-w-2xl mx-auto px-6 py-10">

        <div class="bg-white rounded-lg shadow-md p-8">

            <!-- Heading -->
            <div class="text-center mb-8">

                <h1 class="text-3xl font-bold">
                    QR Verification
                </h1>

                <p class="text-gray-600 mt-2">
                    Scan the customer's QR code to verify the order.
                </p>

            </div>


            <!-- QR Scanner -->
            <div class="mb-6">

                <h2 class="text-xl font-bold mb-4">
                    Scan QR Code
                </h2>

                <div
                    id="reader"
                    class="w-full">
                </div>

            </div>


            <!-- Manual Token -->
            <div class="mb-6">

                <label
                    for="qrToken"
                    class="block font-semibold mb-2">

                    Or Enter QR Token Manually

                </label>

                <input
                    type="text"
                    id="qrToken"
                    placeholder="Enter QR token"
                    class="w-full border p-3 rounded-lg"
                >

                <button
                    onclick="verifyManualToken()"
                    class="w-full mt-3 bg-blue-600 text-white py-3 rounded-lg font-semibold hover:bg-blue-700">

                    Verify QR

                </button>

            </div>


            <!-- Message -->
            <div
                id="message"
                class="hidden p-4 rounded-lg mb-6 text-center">
            </div>


            <!-- Order Details -->
            <div
                id="orderDetails"
                class="hidden">

                <div class="border-t pt-6">

                    <h2 class="text-xl font-bold mb-5">
                        Order Details
                    </h2>


                    <!-- Order ID -->
                    <div class="flex justify-between border-b py-3">

                        <span class="text-gray-600">
                            Order ID
                        </span>

                        <span
                            id="orderId"
                            class="font-semibold">

                            --

                        </span>

                    </div>


                    <!-- Total -->
                    <div class="flex justify-between border-b py-3">

                        <span class="text-gray-600">
                            Total Amount
                        </span>

                        <span
                            id="totalAmount"
                            class="font-semibold">

                            --

                        </span>

                    </div>


                    <!-- Pickup Date -->
                    <div class="flex justify-between border-b py-3">

                        <span class="text-gray-600">
                            Pickup Date
                        </span>

                        <span
                            id="pickupDate"
                            class="font-semibold">

                            --

                        </span>

                    </div>


                    <!-- Pickup Time -->
                    <div class="flex justify-between border-b py-3">

                        <span class="text-gray-600">
                            Pickup Time
                        </span>

                        <span
                            id="pickupTime"
                            class="font-semibold">

                            --

                        </span>

                    </div>


                    <!-- Counter -->
                    <div class="flex justify-between border-b py-3">

                        <span class="text-gray-600">
                            Pickup Counter
                        </span>

                        <span
                            id="counter"
                            class="font-semibold">

                            --

                        </span>

                    </div>


                    <!-- Order Status -->
                    <div class="flex justify-between py-3">

                        <span class="text-gray-600">
                            Order Status
                        </span>

                        <span
                            id="orderStatus"
                            class="font-semibold">

                            --

                        </span>

                    </div>

                </div>


                <!-- Order Verified -->
                <div
                    class="bg-green-50 border border-green-200 rounded-lg p-5 mt-6 text-center">

                    <div class="text-green-600 text-4xl mb-2">
                        ✓
                    </div>

                    <h3 class="text-xl font-bold text-green-700">
                        Order Verified
                    </h3>

                    <p class="text-gray-600 mt-2">
                        Collect payment at the counter before
                        handing over the food.
                    </p>

                </div>

            </div>

        </div>

    </main>



    <script>

        // ==========================================
        // QR SCANNER
        // ==========================================

        let scanner = null;

        let scannerRunning = false;


        function startScanner() {

            scanner = new Html5Qrcode("reader");


            scanner.start(

                {
                    facingMode: "environment"
                },

                {
                    fps: 10,
                    qrbox: 250
                },

                (decodedText) => {

                    // Stop scanner after successful scan
                    stopScanner();

                    // Put scanned token into input
                    document.getElementById(
                        "qrToken"
                    ).value = decodedText;

                    // Verify token
                    verifyToken(decodedText);

                },

                (errorMessage) => {

                    // Scanner errors are ignored
                    // while searching for a QR code.

                }

            ).then(() => {

                scannerRunning = true;

            }).catch((error) => {

                console.error(
                    "Unable to start camera:",
                    error
                );

                showMessage(
                    "Unable to access camera. Please enter the QR token manually.",
                    "error"
                );

            });

        }



        // ==========================================
        // STOP SCANNER
        // ==========================================

        function stopScanner() {

            if (
                scanner &&
                scannerRunning
            ) {

                scanner.stop()
                    .then(() => {

                        scannerRunning = false;

                    })
                    .catch(error => {

                        console.error(error);

                    });

            }

        }



        // ==========================================
        // VERIFY MANUAL TOKEN
        // ==========================================

        function verifyManualToken() {

            const token =
                document.getElementById(
                    "qrToken"
                ).value.trim();


            if (!token) {

                showMessage(
                    "Please enter a QR token.",
                    "error"
                );

                return;

            }


            verifyToken(token);

        }



        // ==========================================
        // VERIFY QR TOKEN
        // ==========================================

        async function verifyToken(token) {

            hideMessage();

            hideOrderDetails();


            try {

                const response = await fetch(

                   `https://smart-canteen-1-qysl.onrender.com/api/orders/qr/${encodeURIComponent(token)}`

                );


                const data =
                    await response.json();


                // Invalid QR
                if (!response.ok) {

                    showMessage(
                        data.message ||
                        "Invalid QR code.",
                        "error"
                    );

                    return;

                }


                // Display order details
                displayOrderDetails(data);


                showMessage(
                    "Order verified successfully.",
                    "success"
                );


            } catch (error) {

                console.error(error);

                showMessage(
                    "Cannot connect to server. Please try again.",
                    "error"
                );

            }

        }



        // ==========================================
        // DISPLAY ORDER DETAILS
        // ==========================================

        function displayOrderDetails(data) {

            document.getElementById(
                "orderId"
            ).textContent =
                data.id || data.order_id || "--";


            document.getElementById(
                "totalAmount"
            ).textContent =
                data.total_amount !== undefined
                    ? `₹${data.total_amount}`
                    : "--";


            document.getElementById(
                "pickupDate"
            ).textContent =
                data.pickup_date || "--";


            document.getElementById(
                "pickupTime"
            ).textContent =
                formatTime(data.pickup_time);


            document.getElementById(
                "counter"
            ).textContent =
                data.counter || "--";


            document.getElementById(
                "orderStatus"
            ).textContent =
                data.status || "--";


            // Show details
            document.getElementById(
                "orderDetails"
            ).classList.remove("hidden");

        }



        // ==========================================
        // FORMAT TIME
        // ==========================================

        function formatTime(time) {

            if (!time) {

                return "--";

            }


            const parts =
                time.toString().split(":");


            if (parts.length < 2) {

                return time;

            }


            let hour =
                parseInt(parts[0]);


            const minute =
                parts[1];


            const ampm =
                hour >= 12
                    ? "PM"
                    : "AM";


            hour =
                hour % 12 || 12;


            return `${hour}:${minute} ${ampm}`;

        }



        // ==========================================
        // SHOW MESSAGE
        // ==========================================

        function showMessage(
            message,
            type
        ) {

            const messageBox =
                document.getElementById(
                    "message"
                );


            messageBox.textContent =
                message;


            messageBox.classList.remove(
                "hidden",
                "bg-green-50",
                "border-green-200",
                "text-green-700",
                "bg-red-50",
                "border-red-200",
                "text-red-700"
            );


            if (type === "success") {

                messageBox.classList.add(
                    "bg-green-50",
                    "border-green-200",
                    "text-green-700"
                );

            } else {

                messageBox.classList.add(
                    "bg-red-50",
                    "border-red-200",
                    "text-red-700"
                );

            }

        }



        // ==========================================
        // HIDE MESSAGE
        // ==========================================

        function hideMessage() {

            document.getElementById(
                "message"
            ).classList.add("hidden");

        }



        // ==========================================
        // HIDE ORDER DETAILS
        // ==========================================

        function hideOrderDetails() {

            document.getElementById(
                "orderDetails"
            ).classList.add("hidden");

        }



        // ==========================================
        // LOGOUT
        // ==========================================

        function logout() {

            localStorage.removeItem(
                "student"
            );

            localStorage.removeItem(
                "user_id"
            );

            window.location.href =
                "login.html";

        }



        // ==========================================
        // LOGIN / LOGOUT LINK
        // ==========================================

        const student =
            localStorage.getItem(
                "student"
            );


        const authLink =
            document.getElementById(
                "authLink"
            );


        if (student) {

            authLink.innerHTML = `

                <button
                    onclick="logout()"
                    class="text-red-600 font-semibold">

                    Logout

                </button>

            `;

        } else {

            authLink.innerHTML = `

                <a
                    href="login.html"
                    class="text-gray-700">

                    Login

                </a>

            `;

        }



        // ==========================================
        // START CAMERA SCANNER
        // ==========================================

        startScanner();

    </script>

</body>

</html>
